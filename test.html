<script>
(function() {
    const trigger = document.getElementById('hi-widget-trigger');
    const modal = document.getElementById('hi-widget-modal');
    const closeBtn = document.getElementById('hi-widget-close');
    const form = document.getElementById('hi-contact-form');
    const statusDiv = document.getElementById('hi-form-status');

    if (!trigger || !modal || !closeBtn || !form) {
        console.error('HostInside Widget: Один или несколько ключевых элементов не найдены.');
        return;
    }

    const applyTheme = (isDark) => {
        const tooltip = trigger.querySelector('.hi-tooltip');
        if (isDark) {
            modal.classList.add('hi-widget-dark-mode');
            if (tooltip) tooltip.classList.add('hi-widget-dark-mode');
        } else {
            modal.classList.remove('hi-widget-dark-mode');
            if (tooltip) tooltip.classList.remove('hi-widget-dark-mode');
        }
    };

    try {
        const colorSchemeQuery = window.matchMedia('(prefers-color-scheme: dark)');
        applyTheme(colorSchemeQuery.matches);
        colorSchemeQuery.addEventListener('change', (e) => applyTheme(e.matches));
    } catch (e) {
        console.error('HostInside Widget: Could not set up theme detection.', e);
    }

    const toggleModal = () => modal.classList.toggle('is-open');

    trigger.addEventListener('click', toggleModal);
    closeBtn.addEventListener('click', toggleModal);

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        statusDiv.textContent = 'Отправка...';
        statusDiv.style.color = '#333';
        try {
            const formData = new FormData(form);
            const response = await fetch('/crm/send_contact_form.php', {
                method: 'POST',
                body: formData,
                headers: { 'Accept': 'application/json' }
            });
            const result = await response.json();
            if (response.ok && result.status === 'success') {
                statusDiv.textContent = result.message;
                statusDiv.style.color = 'green';
                form.reset();
            } else {
                throw new Error(result.message || 'Произошла ошибка.');
            }
        } catch (error) {
            statusDiv.textContent = 'Ошибка: ' + error.message;
            statusDiv.style.color = 'red';
        }
    });
})();
</script>
