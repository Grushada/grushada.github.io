<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧸 Игровая для малышей — PieSenia</title>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0a1f;
  --card:rgba(30,20,60,0.7);
  --border:rgba(255,255,255,0.12);
  --pink:#ff6ec7;
  --blue:#4fc3f7;
  --yellow:#ffd54f;
  --green:#66d67a;
  --purple:#b07eff;
  --orange:#ff9950;
  --text:#fff;
  --radius:32px;
}
body{
  font-family:'Nunito',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  padding:16px;
  display:flex;
  flex-direction:column;
  align-items:center;
  background-image:
    radial-gradient(ellipse at 20% 30%,rgba(255,110,199,0.25) 0%,transparent 55%),
    radial-gradient(ellipse at 80% 70%,rgba(79,195,247,0.25) 0%,transparent 55%),
    radial-gradient(ellipse at 50% 100%,rgba(176,126,255,0.2) 0%,transparent 60%);
  overflow-x:hidden;
}
.container{max-width:900px;width:100%}

/* HEADER */
header{text-align:center;padding:20px 0 10px}
.logo{font-size:80px;display:inline-block;filter:drop-shadow(0 0 30px rgba(255,110,199,0.6));animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
h1{
  font-family:'Comfortaa',sans-serif;
  font-size:clamp(2rem,6vw,3rem);
  font-weight:700;
  background:linear-gradient(135deg,#ffd54f,#ff6ec7,#b07eff,#4fc3f7);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin:6px 0;
  text-align:center;
}
.subtitle{color:rgba(255,255,255,0.7);font-size:1.05rem;font-weight:600;text-align:center}

/* STARS */
.stars-bar{
  display:flex;justify-content:center;align-items:center;gap:14px;
  background:rgba(255,213,79,0.12);
  border:2px solid rgba(255,213,79,0.4);
  border-radius:40px;
  padding:12px 24px;
  margin:16px auto 0;
  max-width:400px;
  box-shadow:0 0 30px rgba(255,213,79,0.3);
}
.stars-bar .star-icon{font-size:2rem;animation:spin 4s linear infinite}
@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
.stars-bar .stars-count{font-family:'Comfortaa',sans-serif;font-size:1.6rem;font-weight:700;color:var(--yellow)}
.stars-bar .stars-label{font-size:0.85rem;color:rgba(255,255,255,0.7)}

/* HOME - GAME CARDS */
.home-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  gap:18px;
  margin-top:30px;
  padding:0 4px;
}
.game-tile{
  background:var(--card);
  backdrop-filter:blur(20px);
  border:3px solid var(--border);
  border-radius:var(--radius);
  padding:24px 16px;
  text-align:center;
  cursor:pointer;
  transition:all 0.25s;
  user-select:none;
  position:relative;
  overflow:hidden;
}
.game-tile:hover{transform:translateY(-6px) scale(1.03);border-color:var(--pink);box-shadow:0 14px 40px rgba(255,110,199,0.35)}
.game-tile:active{transform:scale(0.97)}
.game-tile .tile-icon{font-size:4.5rem;line-height:1;margin-bottom:12px;display:block;filter:drop-shadow(0 4px 12px rgba(0,0,0,0.3))}
.game-tile .tile-name{font-family:'Comfortaa',sans-serif;font-size:1.1rem;font-weight:700;color:#fff;line-height:1.3}
.game-tile .tile-desc{font-size:0.8rem;color:rgba(255,255,255,0.6);margin-top:4px}
.game-tile.tile-pink{background:linear-gradient(135deg,rgba(255,110,199,0.18),rgba(176,126,255,0.12));border-color:rgba(255,110,199,0.4)}
.game-tile.tile-blue{background:linear-gradient(135deg,rgba(79,195,247,0.18),rgba(176,126,255,0.12));border-color:rgba(79,195,247,0.4)}
.game-tile.tile-yellow{background:linear-gradient(135deg,rgba(255,213,79,0.18),rgba(255,153,80,0.12));border-color:rgba(255,213,79,0.4)}
.game-tile.tile-green{background:linear-gradient(135deg,rgba(102,214,122,0.18),rgba(79,195,247,0.12));border-color:rgba(102,214,122,0.4)}
.game-tile.tile-purple{background:linear-gradient(135deg,rgba(176,126,255,0.18),rgba(255,110,199,0.12));border-color:rgba(176,126,255,0.4)}
.game-tile.tile-orange{background:linear-gradient(135deg,rgba(255,153,80,0.18),rgba(255,213,79,0.12));border-color:rgba(255,153,80,0.4)}

/* GAME SCREEN */
.game-screen{display:none;margin-top:20px}
.game-screen.active{display:block}
.game-header{
  display:flex;justify-content:space-between;align-items:center;
  background:rgba(255,255,255,0.06);
  border-radius:24px;
  padding:12px 16px;
  margin-bottom:18px;
  gap:12px;
}
.btn-back{
  background:linear-gradient(135deg,#ff6ec7,#b07eff);
  border:none;
  color:#fff;
  padding:12px 20px;
  border-radius:20px;
  font-family:'Comfortaa',sans-serif;
  font-size:1rem;
  font-weight:700;
  cursor:pointer;
  display:flex;align-items:center;gap:8px;
  box-shadow:0 6px 20px rgba(255,110,199,0.4);
  transition:all 0.2s;
}
.btn-back:hover{transform:scale(1.05)}
.btn-back:active{transform:scale(0.95)}
.game-title-bar{font-family:'Comfortaa',sans-serif;font-size:1.1rem;font-weight:700;color:#fff;flex:1;text-align:center}
.game-progress{font-size:0.85rem;color:rgba(255,255,255,0.7);font-weight:700}

/* VOICE BUTTON */
.btn-voice{
  background:rgba(79,195,247,0.2);
  border:2px solid rgba(79,195,247,0.5);
  color:#4fc3f7;
  width:48px;height:48px;
  border-radius:50%;
  cursor:pointer;
  font-size:1.4rem;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.2s;
}
.btn-voice:hover{background:rgba(79,195,247,0.35)}
.btn-voice.off{opacity:0.4}

/* GAME AREA */
.game-area{
  background:var(--card);
  backdrop-filter:blur(20px);
  border:3px solid var(--border);
  border-radius:var(--radius);
  padding:32px 24px;
  min-height:400px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:24px;
  text-align:center;
}
.prompt{
  font-family:'Comfortaa',sans-serif;
  font-size:clamp(1.3rem,4vw,1.9rem);
  font-weight:700;
  color:#fff;
  line-height:1.3;
  text-shadow:0 2px 16px rgba(255,110,199,0.4);
  padding:0 8px;
}

/* OPTIONS - BIG BUTTONS */
.options-grid{
  display:grid;
  gap:20px;
  width:100%;
  max-width:520px;
  margin-top:10px;
}
.options-grid.cols-2{grid-template-columns:repeat(2,1fr)}
.options-grid.cols-3{grid-template-columns:repeat(3,1fr)}
.options-grid.cols-4{grid-template-columns:repeat(4,1fr)}
.option-btn{
  aspect-ratio:1;
  border-radius:32px;
  border:4px solid rgba(255,255,255,0.15);
  background:rgba(255,255,255,0.06);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:all 0.2s;
  font-size:clamp(3rem,12vw,5.5rem);
  line-height:1;
  user-select:none;
  padding:8px;
}
.option-btn:hover{border-color:var(--pink);transform:scale(1.05);box-shadow:0 0 30px rgba(255,110,199,0.4)}
.option-btn:active{transform:scale(0.92)}
.option-btn.correct{
  animation:correctPop 0.5s ease;
  border-color:var(--green);
  background:rgba(102,214,122,0.3);
  box-shadow:0 0 50px rgba(102,214,122,0.8);
}
.option-btn.wrong{
  animation:shake 0.5s ease;
  border-color:var(--orange);
  background:rgba(255,153,80,0.2);
}
@keyframes correctPop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}

.option-btn.color-shape{
  font-size:0;
  border-radius:50%;
}
.option-btn .shape-inner{
  width:70%;
  height:70%;
  border-radius:50%;
  box-shadow:inset 0 -6px 20px rgba(0,0,0,0.3);
}

.option-btn.size-comparison{font-size:clamp(2rem,10vw,4rem)}

/* ANIMAL SOUNDS */
.animal-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
  width:100%;
  max-width:520px;
}
.animal-card{
  aspect-ratio:1;
  border-radius:32px;
  border:4px solid rgba(255,255,255,0.15);
  background:rgba(255,255,255,0.06);
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  transition:all 0.2s;
  font-size:clamp(2.5rem,10vw,4rem);
  padding:8px;
}
.animal-card:hover{border-color:var(--yellow);transform:scale(1.05)}
.animal-card:active{transform:scale(0.92);background:rgba(255,213,79,0.2)}
.animal-card .animal-name{font-size:0.8rem;font-family:'Comfortaa',sans-serif;color:rgba(255,255,255,0.7);font-weight:700}

/* MEMORY */
.memory-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  width:100%;
  max-width:400px;
}
.memory-card{
  aspect-ratio:1;
  border-radius:22px;
  background:linear-gradient(135deg,#4fc3f7,#b07eff);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:clamp(2.5rem,10vw,4rem);
  user-select:none;
  transition:all 0.3s;
  border:4px solid rgba(255,255,255,0.15);
  transform-style:preserve-3d;
  position:relative;
}
.memory-card.flipped,.memory-card.matched{
  background:rgba(255,255,255,0.08);
  transform:rotateY(0);
}
.memory-card.matched{border-color:var(--green);box-shadow:0 0 25px rgba(102,214,122,0.6);animation:correctPop 0.4s}
.memory-card .mem-front{position:absolute;font-size:1.6rem;opacity:0.7}

/* SIMON */
.simon-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
  width:100%;
  max-width:400px;
}
.simon-btn{
  aspect-ratio:1;
  border-radius:32px;
  border:5px solid rgba(0,0,0,0.3);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:clamp(2.5rem,12vw,4.5rem);
  transition:all 0.15s;
  user-select:none;
  filter:brightness(0.6);
}
.simon-btn.bright{filter:brightness(1.6);box-shadow:0 0 40px currentColor;transform:scale(1.05)}
.simon-btn:active{transform:scale(0.95)}

/* HOLD-TO-EXIT */
.exit-area{
  text-align:center;
  margin-top:30px;
  padding:20px;
}
.hold-btn{
  position:relative;
  background:linear-gradient(135deg,#ff6ec7,#b07eff);
  border:none;
  color:#fff;
  padding:18px 36px;
  border-radius:50px;
  font-family:'Comfortaa',sans-serif;
  font-size:1.05rem;
  font-weight:700;
  cursor:pointer;
  box-shadow:0 8px 30px rgba(255,110,199,0.5);
  overflow:hidden;
  user-select:none;
  -webkit-user-select:none;
}
.hold-btn .progress-bar{
  position:absolute;
  top:0;left:0;height:100%;
  background:rgba(255,255,255,0.4);
  width:0;
  transition:width 0.05s linear;
  pointer-events:none;
}
.hold-btn.holding .progress-bar{background:rgba(255,255,255,0.5)}
.hold-hint{font-size:0.8rem;color:rgba(255,255,255,0.5);margin-top:10px}

/* MODAL */
.modal{
  position:fixed;inset:0;
  background:rgba(5,5,15,0.9);
  backdrop-filter:blur(20px);
  z-index:2000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.modal.active{display:flex}
.modal-box{
  background:linear-gradient(135deg,rgba(30,20,60,0.98),rgba(20,15,40,0.98));
  border:3px solid rgba(255,110,199,0.4);
  border-radius:36px;
  padding:36px 28px;
  max-width:500px;
  width:100%;
  text-align:center;
  animation:modalIn 0.4s cubic-bezier(0.34,1.56,0.64,1);
  box-shadow:0 30px 80px rgba(0,0,0,0.7),0 0 60px rgba(255,110,199,0.3);
}
@keyframes modalIn{from{opacity:0;transform:scale(0.85) translateY(30px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-box .modal-icon{font-size:5rem;line-height:1;margin-bottom:14px}
.modal-box h3{
  font-family:'Comfortaa',sans-serif;
  font-size:1.5rem;
  color:#fff;
  margin-bottom:10px;
}
.modal-box p{color:rgba(255,255,255,0.7);font-size:1rem;margin-bottom:24px;line-height:1.5}
.modal-actions{display:flex;gap:12px;flex-wrap:wrap}
.modal-btn{
  flex:1;
  min-width:120px;
  padding:16px 24px;
  border-radius:30px;
  border:none;
  font-family:'Comfortaa',sans-serif;
  font-size:1rem;
  font-weight:700;
  cursor:pointer;
  transition:all 0.2s;
}
.modal-btn.yes{background:linear-gradient(135deg,#66d67a,#4fc3f7);color:#fff;box-shadow:0 8px 24px rgba(102,214,122,0.5)}
.modal-btn.no{background:rgba(255,255,255,0.08);color:#fff;border:2px solid rgba(255,255,255,0.2)}
.modal-btn:hover{transform:scale(1.05)}

/* CONFETTI */
.confetti{position:fixed;width:12px;height:12px;pointer-events:none;z-index:3000;animation:confettiFall 2s linear forwards}
@keyframes confettiFall{to{transform:translateY(100vh) rotate(720deg);opacity:0}}

/* TOAST */
.toast{
  position:fixed;bottom:30px;left:50%;
  transform:translateX(-50%) translateY(200px);
  background:linear-gradient(135deg,#66d67a,#4fc3f7);
  color:#fff;
  padding:16px 32px;
  border-radius:40px;
  font-family:'Comfortaa',sans-serif;
  font-weight:700;
  font-size:1rem;
  box-shadow:0 10px 40px rgba(102,214,122,0.5);
  z-index:3000;
  transition:transform 0.4s ease;
  pointer-events:none;
  max-width:90vw;
  text-align:center;
}
.toast.show{transform:translateX(-50%) translateY(0)}

@media (max-width:600px){
  .home-grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .game-tile{padding:18px 12px}
  .game-tile .tile-icon{font-size:3.5rem}
  .game-tile .tile-name{font-size:0.95rem}
  .option-btn{border-radius:24px}
  .game-area{padding:20px 14px;min-height:320px}
}
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="logo">🧸</div>
    <h1>Игровая для малышей</h1>
    <p class="subtitle">Весёлые игры для самых маленьких 🎈</p>
  </header>

  <div class="stars-bar">
    <span class="star-icon">⭐</span>
    <span class="stars-count" id="starsCount">0</span>
    <span class="stars-label">звёздочек</span>
  </div>

  <!-- HOME SCREEN -->
  <div id="homeScreen">
    <div class="home-grid" id="homeGrid">
      <!-- Заполняется через JS -->
    </div>

    <div class="exit-area">
      <button class="hold-btn" id="exitHoldBtn" onmousedown="startHold(event)" onmouseup="cancelHold()" onmouseleave="cancelHold()" ontouchstart="startHold(event)" ontouchend="cancelHold()" ontouchcancel="cancelHold()">
        <span class="progress-bar" id="holdProgress"></span>
        <span style="position:relative;z-index:2">🔒 Взрослый режим (удерживай 3 сек)</span>
      </button>
      <p class="hold-hint">Это чтобы малыш случайно не вышел 🙂</p>
    </div>
  </div>

  <!-- GAME SCREENS (hidden by default) -->
  <div id="gameScreen" class="game-screen">
    <div class="game-header">
      <button class="btn-back" onclick="backHome()">⬅️ Назад</button>
      <div class="game-title-bar" id="gameTitle">Игра</div>
      <button class="btn-voice" id="voiceToggle" onclick="toggleVoice()" title="Голос">🔊</button>
      <div class="game-progress" id="gameProgress">0/10</div>
    </div>
    <div class="game-area" id="gameArea">
      <!-- Содержимое игры -->
    </div>
  </div>
</div>

<!-- EXIT CONFIRM MODAL -->
<div class="modal" id="exitModal">
  <div class="modal-box">
    <div class="modal-icon">🚪</div>
    <h3>Ты хочешь вернуться во взрослый режим?</h3>
    <p>Там рулетка и взрослые игры</p>
    <div class="modal-actions">
      <button class="modal-btn yes" onclick="confirmExit()">✅ Да, вернуться</button>
      <button class="modal-btn no" onclick="closeExitModal()">❌ Остаться</button>
    </div>
  </div>
</div>

<!-- SUCCESS MODAL -->
<div class="modal" id="successModal">
  <div class="modal-box">
    <div class="modal-icon" id="successIcon">🎉</div>
    <h3 id="successTitle">Молодец!</h3>
    <p id="successText">Ты заработал звёздочку!</p>
    <div class="modal-actions">
      <button class="modal-btn yes" onclick="closeSuccessModal()">🎈 Продолжить</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ================== КОНФИГ ==================
const SHAPES = [
  {emoji:'❤️',name:'сердечко',nameAcc:'сердечко'},
  {emoji:'⭐',name:'звёздочку',nameAcc:'звёздочку'},
  {emoji:'🌙',name:'луну',nameAcc:'луну'},
  {emoji:'🍎',name:'яблочко',nameAcc:'яблочко'},
  {emoji:'🌸',name:'цветочек',nameAcc:'цветочек'},
  {emoji:'🐱',name:'котика',nameAcc:'котика'},
  {emoji:'🐶',name:'собачку',nameAcc:'собачку'},
  {emoji:'🍓',name:'клубничку',nameAcc:'клубничку'},
  {emoji:'🐢',name:'черепашку',nameAcc:'черепашку'},
  {emoji:'🎈',name:'шарик',nameAcc:'шарик'},
  {emoji:'🍕',name:'пиццу',nameAcc:'пиццу'},
  {emoji:'🚗',name:'машинку',nameAcc:'машинку'}
];

const COLORS = [
  {hex:'#ef4444', name:'красный',  namePre:'красный'},
  {hex:'#22c55e', name:'зелёный',  namePre:'зелёный'},
  {hex:'#3b82f6', name:'синий',    namePre:'синий'},
  {hex:'#eab308', name:'жёлтый',   namePre:'жёлтый'},
  {hex:'#ec4899', name:'розовый',  namePre:'розовый'},
  {hex:'#a855f7', name:'фиолетовый',namePre:'фиолетовый'}
];

const ANIMALS = [
  {emoji:'🐮',name:'Корова',sound:'Му-у-у!'},
  {emoji:'🐶',name:'Собачка',sound:'Гав-гав!'},
  {emoji:'🐱',name:'Котик',sound:'Мяу-мяу!'},
  {emoji:'🐷',name:'Свинка',sound:'Хрю-хрю!'},
  {emoji:'🐸',name:'Лягушка',sound:'Ква-ква!'},
  {emoji:'🐔',name:'Курочка',sound:'Ко-ко-ко!'},
  {emoji:'🐴',name:'Лошадка',sound:'И-го-го!'},
  {emoji:'🦆',name:'Уточка',sound:'Кря-кря!'},
  {emoji:'🐑',name:'Овечка',sound:'Бе-е-е!'}
];

const COUNT_ITEMS = ['🍎','🍓','⭐','🎈','🐱','🌸','🍕','🚗','🐢'];

// ================== СОСТОЯНИЕ ==================
let state = {
  stars: 0,
  voiceEnabled: true,
  currentGame: null,
  gameScore: 0,
  gameGoal: 10
};

let currentGameData = {};

function loadState(){
  try{
    const s=localStorage.getItem('kids_state');
    if(s){const p=JSON.parse(s);state.stars=p.stars||0;state.voiceEnabled=p.voiceEnabled!==false}
  }catch(e){}
}
function saveState(){
  try{localStorage.setItem('kids_state',JSON.stringify({stars:state.stars,voiceEnabled:state.voiceEnabled}))}catch(e){}
}

// ================== VOICE ==================
function speak(text,callback){
  if(!state.voiceEnabled){if(callback)setTimeout(callback,100);return}
  try{
    if(!window.speechSynthesis)return;
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='ru-RU';
    u.rate=0.9;
    u.pitch=1.25;
    u.volume=1;
    if(callback)u.onend=callback;
    window.speechSynthesis.speak(u);
  }catch(e){if(callback)setTimeout(callback,100)}
}
function toggleVoice(){
  state.voiceEnabled=!state.voiceEnabled;
  document.getElementById('voiceToggle').textContent=state.voiceEnabled?'🔊':'🔇';

  saveState();

// ================== CONFETTI ==================
function fireConfetti(count=30){
  const colors=['#ff6ec7','#4fc3f7','#ffd54f','#66d67a','#b07eff','#ff9950'];
  for(let i=0;i<count;i++){
    const c=document.createElement('div');
    c.className='confetti';
    c.style.left=Math.random()*100+'vw';
    c.style.top='-20px';
    c.style.background=colors[Math.floor(Math.random()*colors.length)];
    c.style.borderRadius=Math.random()>0.5?'50%':'2px';
    c.style.animationDelay=(Math.random()*0.5)+'s';
    c.style.animationDuration=(1.5+Math.random()*1)+'s';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),3000);
  }
}

// ================== SOUNDS ==================
let audioCtx=null;
function initAudio(){if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}}
function beep(freq,dur=0.15,type='sine',vol=0.15){
  initAudio();if(!audioCtx)return;
  try{
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type=type;o.frequency.value=freq;
    g.gain.setValueAtTime(vol,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
    o.connect(g);g.connect(audioCtx.destination);
    o.start();o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}
function soundHappy(){[523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>beep(f,0.18,'sine',0.2),i*90))}
function soundTryAgain(){[500,400,350].forEach((f,i)=>setTimeout(()=>beep(f,0.15,'triangle',0.12),i*120))}
function soundClick(){beep(700,0.06,'sine',0.1)}
function soundStar(){[880,1100,1320].forEach((f,i)=>setTimeout(()=>beep(f,0.15,'sine',0.2),i*100))}

// ================== HOME ==================
function renderHome(){
  const grid=document.getElementById('homeGrid');
  grid.innerHTML=GAMES.map(g=>`
    <div class="game-tile tile-${g.color}" onclick="startGame('${g.id}')">
      <span class="tile-icon">${g.icon}</span>

  `).join('');

function showHome(){
  document.getElementById('homeScreen').style.display='block';
  document.getElementById('gameScreen').classList.remove('active');
  state.currentGame=null;
  if(window.speechSynthesis)window.speechSynthesis.cancel();
}

function backHome(){
  soundClick();
  showHome();
  speak('Молодец! Возвращайся играть ещё');

// ================== GAME START ==================
function startGame(gameId){
  soundClick();
  state.currentGame=gameId;
  state.gameScore=0;
  currentGameData={};
  document.getElementById('homeScreen').style.display='none';
  document.getElementById('gameScreen').classList.add('active');
  document.getElementById('voiceToggle').textContent=state.voiceEnabled?'🔊':'🔇';
  const game=GAMES.find(g=>g.id===gameId);
  document.getElementById('gameTitle').textContent=game.name;

  switch(gameId){
    case 'find':    startFind(); break;
    case 'count':   startCount(); break;
    case 'colors':  startColors(); break;
    case 'sizes':   startSizes(); break;
    case 'animals': startAnimals(); break;
    case 'memory':  startMemory(); break;
    case 'simon':   startSimon(); break;
  }
}

function updateProgress(){
  document.getElementById('gameProgress').textContent=`${state.gameScore}/${state.gameGoal}`;
}

function winRound(onComplete){
  state.gameScore++;
  updateProgress();
  soundHappy();
  fireConfetti(15);
  addStar(1);
  if(state.gameScore>=state.gameGoal){
    setTimeout(()=>{
      document.getElementById('successIcon').textContent='🏆';
      document.getElementById('successTitle').textContent='Ура! Ты справился!';
      document.getElementById('successText').textContent=`Ты собрал ${state.gameGoal} звёздочек в этой игре!`;
      document.getElementById('successModal').classList.add('active');
      speak('Молодец! Ты справился со всеми заданиями!');
    },800);
  }else{
    setTimeout(()=>{onComplete&&onComplete()},800);
  }
}

function closeSuccessModal(){
  document.getElementById('successModal').classList.remove('active');
  soundClick();
  showHome();
}

// ================== 1. FIND SHAPE ==================
function startFind(){
  currentGameData={target:null,options:[]};
  nextFindRound();
}
function nextFindRound(){
  updateProgress();
  const pool=[...SHAPES].sort(()=>Math.random()-0.5);
  const target=pool[0];
  const wrongs=pool.slice(1,4);
  const options=[target,...wrongs].sort(()=>Math.random()-0.5);
  currentGameData.target=target;

  document.getElementById('gameArea').innerHTML=`
    <div class="prompt">Найди ${target.name}!</div>
    <div class="options-grid cols-4" id="findOptions">
      ${options.map(o=>`<button class="option-btn" onclick="clickFind('${o.emoji}')">${o.emoji}</button>`).join('')}
    </div>
  `;
  speak(`Найди ${target.nameAcc}!`);
}
function clickFind(emoji){
  if(emoji===currentGameData.target.emoji){
    const btn=[...document.querySelectorAll('#findOptions .option-btn')].find(b=>b.textContent===emoji);
    btn.classList.add('correct');
    speak('Правильно! Молодец!');
    winRound(nextFindRound);
  }else{
    const btn=[...document.querySelectorAll('#findOptions .option-btn')].find(b=>b.textContent===emoji);
    btn.classList.add('wrong');
    setTimeout(()=>btn.classList.remove('wrong'),600);
    soundTryAgain();
    speak('Попробуй ещё раз');
  }
}

// ================== 2. COUNT ==================
function startCount(){
  currentGameData={};
  nextCountRound();
}
function nextCountRound(){
  updateProgress();
  const count=1+Math.floor(Math.random()*5);
  const item=COUNT_ITEMS[Math.floor(Math.random()*COUNT_ITEMS.length)];
  const wrongCounts=[];
  while(wrongCounts.length<3){
    const c=1+Math.floor(Math.random()*6);
    if(c!==count&&!wrongCounts.includes(c))wrongCounts.push(c);
  }
  const options=[count,...wrongCounts].sort(()=>Math.random()-0.5);
  currentGameData.count=count;

  const groups=options.map(n=>{
    let html='';
    for(let i=0;i<n;i++)html+=`<span style="font-size:clamp(1.2rem,4vw,2rem);display:inline-block">${item}</span>`;
    return `<button class="option-btn" style="aspect-ratio:auto;min-height:90px;flex-direction:column;font-size:0" onclick="clickCount(${n})">${html}<div style="font-size:1.5rem;margin-top:6px;color:#ffd54f;font-family:Comfortaa;font-weight:700">${n}</div></button>`;
  }).join('');

  document.getElementById('gameArea').innerHTML=`
    <div class="prompt">Покажи, где ${count} ${item}</div>
    <div class="options-grid cols-2" id="countOptions">${groups}</div>
  `;
  speak(`Покажи, где ${count}`);
}
function clickCount(n){
  if(n===currentGameData.count){
    speak('Верно! Ты умница!');
    winRound(nextCountRound);
  }else{
    soundTryAgain();
    speak('Посчитай ещё раз');
  }
}

}

// ================== 5. ANIMALS ==================
function startAnimals(){
  updateProgress();
  document.getElementById('gameArea').innerHTML=`
    <div class="prompt">Нажми на животных — они говорят!</div>
    <div class="animal-grid">
      ${ANIMALS.map(a=>`<div class="animal-card" onclick="clickAnimal('${a.emoji}')"><span>${a.emoji}</span><div class="animal-name">${a.name}</div></div>`).join('')}

  speak('Нажимай на животных, они будут говорить!');

  document.getElementById('gameProgress').textContent='∞';

function clickAnimal(emoji){
  const a=ANIMALS.find(x=>x.emoji===emoji);
  if(!a)return;
  beep(600+Math.random()*200,0.1,'sine',0.15);

// ================== 6. MEMORY ==================
function startMemory(){
  currentGameData={flipped:[],matched:0,lock:false};
  const pool=[...SHAPES].sort(()=>Math.random()-0.5).slice(0,3);
  const cards=[...pool,...pool].sort(()=>Math.random()-0.5);
  currentGameData.cards=cards;

  document.getElementById('gameArea').innerHTML=`
    <div class="prompt">Найди пару!</div>
    <div class="memory-grid" id="memoryGrid">
      ${cards.map((c,i)=>`<div class="memory-card" data-idx="${i}" onclick="flipMem(${i})"><span class="mem-front">❓</span><span class="mem-back" style="display:none">${c.emoji}</span></div>`).join('')}
    </div>
  `;
  state.gameGoal=3;
  updateProgress();
  speak('Найди две одинаковые картинки!');
}
function flipMem(idx){
  const data=currentGameData;
  if(data.lock)return;
  const card=document.querySelector(`.memory-card[data-idx="${idx}"]`);
  if(card.classList.contains('flipped')||card.classList.contains('matched'))return;
  card.querySelector('.mem-front').style.display='none';
  card.querySelector('.mem-back').style.display='inline';
  card.classList.add('flipped');
  data.flipped.push(idx);
  soundClick();
  if(data.flipped.length===2){
    data.lock=true;
    const [a,b]=data.flipped;
    if(data.cards[a].emoji===data.cards[b].emoji){
      setTimeout(()=>{
        document.querySelector(`.memory-card[data-idx="${a}"]`).classList.add('matched');
        document.querySelector(`.memory-card[data-idx="${b}"]`).classList.add('matched');
        data.matched++;
        state.gameScore++;
        updateProgress();
        soundHappy();
        fireConfetti(10);
        addStar(1);
        speak('Молодец!');
        data.flipped=[];data.lock=false;
        if(data.matched>=3){
          setTimeout(()=>{
            document.getElementById('successIcon').textContent='🏆';
            document.getElementById('successTitle').textContent='Все пары найдены!';
            document.getElementById('successText').textContent='Ты нашёл все пары!';
            document.getElementById('successModal').classList.add('active');
            speak('Ура! Ты нашёл все пары!');
          },500);
        }
      },400);
    }else{
      setTimeout(()=>{
        [a,b].forEach(i=>{
          const c=document.querySelector(`.memory-card[data-idx="${i}"]`);
          c.classList.remove('flipped');
          c.querySelector('.mem-front').style.display='inline';
          c.querySelector('.mem-back').style.display='none';
        });
        data.flipped=[];data.lock=false;
        soundTryAgain();
      },900);
    }
  }
}

// ================== 7. SIMON ==================
function startSimon(){
  currentGameData={sequence:[],playerIdx:0,showing:false,level:1};
  const colors=[
    {color:'#ef4444',emoji:'🐶',freq:400},
    {color:'#22c55e',emoji:'🐱',freq:500},
    {color:'#3b82f6',emoji:'🐰',freq:600},
    {color:'#eab308',emoji:'🐸',freq:700}
  ];
  currentGameData.colors=colors;
  document.getElementById('gameArea').innerHTML=`
    <div class="prompt" id="simonPrompt">Смотри и запоминай!</div>
    <div class="simon-grid" id="simonGrid">
      ${colors.map((c,i)=>`<button class="simon-btn" data-idx="${i}" style="background:${c.color};color:${c.color}" onclick="clickSimon(${i})">${c.emoji}</button>`).join('')}
    </div>
  `;
  state.gameGoal=5;
  updateProgress();
  setTimeout(startSimonRound,600);
}
function startSimonRound(){
  const d=currentGameData;
  d.sequence.push(Math.floor(Math.random()*4));
  d.playerIdx=0;
  d.showing=true;
  speak(`Уровень ${d.level}. Смотри!`);
  document.getElementById('simonPrompt').textContent='Смотри и запоминай!';
  d.sequence.forEach((idx,i)=>{
    setTimeout(()=>{
      const btn=document.querySelector(`.simon-btn[data-idx="${idx}"]`);
      if(btn){
        btn.classList.add('bright');
        beep(d.colors[idx].freq,0.3,'sine',0.2);
        setTimeout(()=>btn.classList.remove('bright'),350);
      }
      if(i===d.sequence.length-1){
        setTimeout(()=>{
          d.showing=false;
          document.getElementById('simonPrompt').textContent='Твоя очередь!';
          speak('Теперь ты повтори!');
        },500);
      }
    },i*600+400);
  });
}
function clickSimon(idx){
  const d=currentGameData;
  if(d.showing)return;
  const btn=document.querySelector(`.simon-btn[data-idx="${idx}"]`);
  btn.classList.add('bright');
  beep(d.colors[idx].freq,0.3,'sine',0.2);
  setTimeout(()=>btn.classList.remove('bright'),300);

  if(d.sequence[d.playerIdx]===idx){
    d.playerIdx++;
    if(d.playerIdx>=d.sequence.length){
      state.gameScore++;
      updateProgress();
      addStar(1);
      fireConfetti(10);
      speak('Молодец!');
      d.level++;
      if(d.level>state.gameGoal){
        setTimeout(()=>{
          document.getElementById('successIcon').textContent='🏆';
          document.getElementById('successTitle').textContent='Ты супер!';
          document.getElementById('successText').textContent='Прошёл все уровни!';
          document.getElementById('successModal').classList.add('active');
        },500);
      }else{
        setTimeout(startSimonRound,1200);
      }
    }
  }else{
    soundTryAgain();
    speak('Ой, не так. Давай ещё раз');
    setTimeout(()=>{
      d.sequence=[];
      d.level=1;
      startSimonRound();
    },1200);
  }
}

// ================== EXIT WITH HOLD ==================
let holdInterval=null;
let holdStart=0;
function startHold(e){
  e.preventDefault();
  const btn=document.getElementById('exitHoldBtn');
  const bar=document.getElementById('holdProgress');
  btn.classList.add('holding');
  holdStart=Date.now();
  holdInterval=setInterval(()=>{
    const elapsed=Date.now()-holdStart;
    const pct=Math.min(100,(elapsed/3000)*100);
    bar.style.width=pct+'%';
    if(elapsed>=3000){
      cancelHold();
      openExitModal();
    }
  },30);
}
function cancelHold(){
  clearInterval(holdInterval);
  holdInterval=null;
  const btn=document.getElementById('exitHoldBtn');
  const bar=document.getElementById('holdProgress');
  btn.classList.remove('holding');
  bar.style.width='0%';
}
function openExitModal(){
  soundClick();
  speak('Ты хочешь вернуться во взрослый режим?');
  setTimeout(()=>{
    document.getElementById('exitModal').classList.add('active');
  },1500);
}
function closeExitModal(){
  document.getElementById('exitModal').classList.remove('active');
  soundClick();
  speak('Оставайся играть!');
}
function confirmExit(){
  soundClick();
  document.getElementById('exitModal').classList.remove('active');
  speak('Возвращаемся во взрослый режим!',()=>{
    window.location.href='/ruletka';
  });
  setTimeout(()=>{
    window.location.href='/ruletka';
  },1800);
}
